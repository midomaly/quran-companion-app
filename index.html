<!doctype html>
<html lang="en">

<head>
  <script>
    /* Silent-crash reporter v3 — this template disables Vite's full-screen error
       overlay, so any startup failure would render a blank white page with no
       message. Captures errors + console errors, reports live module-fetch
       status, and probes /src/main.tsx so a silent hang names itself.
       The static boot splash (#noor-boot, in <body>) covers slow loads; this
       script only takes over with diagnostics if the app is still not mounted
       after 11s, and hides everything the moment React mounts. */
    (function () {
      var origError = console.error;
      var errors = []; /* { m: message, c: isFromConsole } */
      var overlay = null;
      var booted = Date.now();
      var mountedOk = false;
      var lastProbe = "probe: pending (runs every 3s)";
      var reportTimer = null;
      window.__noorMounted = false;

      function add(msg, isConsole) {
        if (errors.length < 8) errors.push({ m: msg, c: !!isConsole });
        try {
          origError.call(console, "[Noor Al-Islam] diagnostic:", msg);
        } catch (e) {
          /* never let logging throw */
        }
      }
      window.addEventListener(
        "error",
        function (e) {
          var t = e.target;
          if (t && t !== window && t.tagName && t.tagName !== "HTML") {
            add("resource failed: " + (t.src || t.href || t.tagName), false);
            return;
          }
          var where = e.filename ? " @" + e.filename.split("/").pop() + ":" + e.lineno : "";
          add((e.message || "unknown error") + where, false);
        },
        true
      );
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        add("unhandled rejection: " + (r && r.message ? r.message : r), false);
      });
      console.error = function () {
        var parts = [];
        for (var i = 0; i < arguments.length; i++) {
          var a = arguments[i];
          parts.push(a && a.message ? a.message : String(a));
        }
        add("console.error: " + parts.join(" ").slice(0, 300), true);
        return origError.apply(console, arguments);
      };

      function isMounted() {
        var root = document.getElementById("root");
        return !!(root && root.childNodes.length > 0);
      }

      function hideBoot() {
        window.__noorMounted = true;
        var b = document.getElementById("noor-boot");
        if (b && b.parentNode) b.parentNode.removeChild(b);
        if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        if (reportTimer) {
          clearInterval(reportTimer);
          reportTimer = null;
        }
        try {
          sessionStorage.removeItem("noor:bootRetry");
        } catch (e) {
          /* storage unavailable */
        }
      }

      function paint(lines, cover) {
        if (overlay) {
          overlay.textContent = lines.join("\n");
          return;
        }
        overlay = document.createElement("div");
        overlay.style.cssText =
          "position:fixed;left:0;right:0;" +
          (cover ? "top:0;bottom:0;" : "top:auto;") +
          "z-index:2147483647;background:#fff;color:#111;" +
          "font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:16px;" +
          "overflow:auto;white-space:pre-wrap;direction:ltr;text-align:left;" +
          (cover ? "" : "max-height:50vh;border-bottom:2px solid #111;");
        overlay.textContent = lines.join("\n");
        (document.body || document.documentElement).appendChild(overlay);
      }

      function resourceCount() {
        try {
          return performance.getEntriesByType("resource").length;
        } catch (e) {
          return 0;
        }
      }

      function timingMap() {
        var done = {};
        var res = performance.getEntriesByType("resource");
        for (var i = 0; i < res.length; i++) {
          done[res[i].name] = Math.round(res[i].duration) + "ms";
        }
        return done;
      }

      function statusLines() {
        var kids = isMounted() ? document.getElementById("root").childNodes.length : 0;
        var lines = [];
        lines.push(
          "Noor Al-Islam diagnostics (t=" + Math.round(Date.now() - booted) +
            "ms, readyState=" + document.readyState +
            ", #root children=" + kids + ")"
        );
        lines.push(
          "progress: " + resourceCount() + " network requests finished so far" +
            (mountedOk ? "" : " — still loading…")
        );
        lines.push("href: " + location.href.slice(0, 120));
        var done = timingMap();
        var scrs = document.querySelectorAll("script[src]");
        lines.push("-- head module scripts --");
        for (var j = 0; j < scrs.length; j++) {
          var s = scrs[j].src;
          lines.push(
            "  NET " +
              (done[s] !== undefined ? "DONE " + done[s] : "PENDING") +
              "  " +
              s.replace(location.origin, "")
          );
        }
        var watch = [
          "/src/main.tsx",
          "@vly-ai_integrations",
          "deps/react.js",
          "deps/react-dom_client",
          "deps/react-router",
          "deps/convex_react",
          "deps/@convex-dev_auth_react",
        ];
        lines.push("-- critical fetches (dynamic boot graph) --");
        for (var w = 0; w < watch.length; w++) {
          var hit = "";
          for (var name in done) {
            if (name.indexOf(watch[w]) !== -1) {
              hit = done[name];
              break;
            }
          }
          lines.push("  " + (hit ? "DONE " + hit : "NOT DONE (in flight or never started)") + "  " + watch[w]);
        }
        lines.push("-- captured (" + errors.length + ") --");
        for (var k = 0; k < errors.length; k++) {
          lines.push("  " + (errors[k].c ? "[console] " : "") + errors[k].m);
        }
        return lines;
      }

      function probe() {
        var t0 = Date.now();
        return Promise.race([
          fetch("/src/main.tsx", { cache: "no-store" })
            .then(function (r) {
              return "probe /src/main.tsx -> HTTP " + r.status + " in " + (Date.now() - t0) + "ms";
            })
            .catch(function (e) {
              return "probe /src/main.tsx -> FETCH ERROR: " + e.message;
            }),
          new Promise(function (res) {
            setTimeout(function () {
              res("probe /src/main.tsx -> TIMEOUT after " + (Date.now() - t0) + "ms (hanging response)");
            }, 2500);
          }),
        ]);
      }

      function report() {
        if (mountedOk || isMounted()) {
          if (!mountedOk) hideBoot();
          return;
        }
        var lines = statusLines();
        lines.push("-- probe --");
        lines.push("  " + lastProbe);
        if (errors.length === 0) {
          lines.push(
            "NOTE: no JS error, #root is empty. If the DONE counts above keep growing, " +
              "the app is still loading — a slow connection can take a minute; leave this open. " +
              "If they are frozen, that fetch is hanging."
          );
        }
        paint(lines, true);
        probe().then(function (p) {
          lastProbe = p;
        });
      }

      function watchRoot() {
        var root = document.getElementById("root");
        if (!root || !window.MutationObserver) return;
        new MutationObserver(function () {
          if (root.childNodes.length > 0 && !mountedOk) {
            mountedOk = true;
            hideBoot();
          }
        }).observe(root, { childList: true, subtree: true });
        if (root.childNodes.length > 0 && !mountedOk) {
          mountedOk = true;
          hideBoot();
        }
      }

      function updateBootStatus() {
        if (mountedOk) return;
        var st = document.getElementById("noor-boot-status");
        if (st) st.textContent = resourceCount() + " requests loaded…";
      }

      function arm() {
        watchRoot();
        updateBootStatus();
        setInterval(updateBootStatus, 2000);
        if (!isMounted()) {
          /* Don't paint at 2.6s — on slow networks loading is normal then.
             Start diagnostics at 11s and keep them live so counts visibly move. */
          setTimeout(report, 11000);
          reportTimer = setInterval(report, 3000);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", arm);
      } else {
        arm();
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Noor Al-Islam — read the complete Holy Qur'an (114 surahs, 6,236 ayahs) in Uthmani script with verified translation, audio recitation, bookmarks and offline reading." />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b5540" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a2f24" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet" />
  <title>Noor Al-Islam — Qur'an & Muslim Companion</title>
  <style>
    #noor-boot {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      background: #0b5540;
      color: #f7e8c4;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      text-align: center;
    }

    #noor-boot .spin {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(242, 215, 145, 0.25);
      border-top-color: #f2d791;
      animation: noor-spin 0.9s linear infinite;
    }

    #noor-boot .ar {
      font-family: "Amiri Quran", "Amiri", serif;
      font-size: 2.4rem;
      line-height: 1.6;
      direction: rtl;
    }

    #noor-boot .nm {
      font-size: 11px;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(247, 232, 196, 0.85);
    }

    #noor-boot .tag {
      font-size: 13px;
      color: rgba(247, 232, 196, 0.6);
    }

    #noor-boot .st {
      font-size: 11px;
      color: rgba(247, 232, 196, 0.45);
      min-height: 1em;
    }

    @keyframes noor-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #noor-boot .spin {
        animation: none;
        border-top-color: rgba(242, 215, 145, 0.6);
      }
    }
  </style>
</head>

<body>
  <!-- Static boot splash: shows instantly (no JS required) and is removed the
       moment React mounts, so slow module loads never look like a dead page. -->
  <div id="noor-boot" role="status" aria-live="polite">
    <div class="spin" aria-hidden="true"></div>
    <div class="ar">نور الإسلام</div>
    <div class="nm">Noor Al-Islam</div>
    <div class="tag">The Complete Qur'an &amp; Muslim Companion</div>
    <div class="st" id="noor-boot-status">Starting…</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    /* Boot via dynamic import (kept alongside the static module tag above).
       Static module scripts execute in document order and wait for every earlier
       module script (platform-injected /@vite/client and html-proxy scripts) to
       settle first — if one of those hangs, the app never runs and the page is
       silently white. A dynamic import from a classic script starts immediately
       and is independent of that queue. The import uses the static tag's exact
       src (including any ?t= cache-buster Vite injects) so both paths resolve
       to the same ES module record and the app can never boot twice. */
    var mainTag = document.querySelector('script[type="module"][src*="main.tsx"]');
    import(mainTag ? mainTag.getAttribute("src") : "/src/main.tsx").catch(function (err) {
      var msg = err && (err.message ? err.message : err);
      console.error("[Noor Al-Islam] boot failed:", msg);
      var el = document.createElement("div");
      el.setAttribute("data-noor-fail", "1");
      el.style.cssText =
        "position:fixed;inset:0;z-index:2147483647;background:#fff;color:#111;" +
        "font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:24px;" +
        "white-space:pre-wrap;direction:ltr;text-align:left";
      el.textContent =
        "Noor Al-Islam could not start.\n\nBoot failed: " + msg +
        "\n\nOpen the browser console for the full stack trace.";
      (document.body || document.documentElement).appendChild(el);
    });

    /* Stall watchdog (replaces the old fixed 6s reload — that one was killing
       legitimate slow boots: on high-latency connections the module graph can
       take a minute to load). Reload with a cache-busting param only when there
       has been ZERO completed network request for ~20s while #root is still
       empty (a wedged first-load connection pool), max 2 attempts. A boot that
       is slow but progressing is left alone. */
    try {
      var retryN = parseInt(sessionStorage.getItem("noor:bootRetry") || "0", 10);
      if (retryN < 2) {
        var lastCount = -1;
        var stallTicks = 0;
        setInterval(function () {
          if (window.__noorMounted) return;
          if (document.querySelector("[data-noor-fail]")) return; /* failure screen shown — don't wipe it */
          var r = document.getElementById("root");
          if (r && r.childNodes.length > 0) return;
          var n = 0;
          try {
            n = performance.getEntriesByType("resource").length;
          } catch (e) {
            /* performance API unavailable */
          }
          if (n === lastCount) stallTicks++;
          else stallTicks = 0;
          lastCount = n;
          if (stallTicks >= 4) {
            sessionStorage.setItem("noor:bootRetry", String(retryN + 1));
            var u = new URL(location.href);
            u.searchParams.set("_bootretry", String(retryN + 1));
            location.replace(u.href);
          }
        }, 5000);
      }
    } catch (e) {
      /* storage unavailable — reporter still covers failures */
    }
  </script>
</body>

</html>
